<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Lyricrizzz</title>
    <link rel="stylesheet" href="lyrics.css" />
  </head>
  <body>
    <main class="widget" aria-label="Floating lyrics">
      <img class="widget-background" alt="" aria-hidden="true" hidden />
      <header class="toolbar" aria-label="Widget controls">
        <span class="drag-handle" title="Drag to move">LYRICRIZZZ</span>
        <button id="settings" title="Settings" aria-label="Settings">⚙</button>
        <button id="add-lyrics" title="Add local lyrics" aria-label="Add local lyrics">＋</button>
        <button id="click-through" title="Toggle click-through (Ctrl+Shift+L)" aria-pressed="false">◎</button>
        <button id="smaller" title="Make widget smaller">−</button>
        <button id="larger" title="Make widget larger">＋</button>
        <label class="opacity-control" title="Window opacity">
          <span>◐</span><input id="opacity" type="range" min="25" max="100" value="94" aria-label="Window opacity" />
        </label>
        <button id="minimize" title="Minimize (Ctrl+Shift+M to restore)">—</button>
        <button id="close" title="Close">×</button>
      </header>
      <section class="lyrics-card">
        <div class="song-label song-status-paused" id="song-label">WAITING FOR PLAYER</div>
        <div class="track-title" id="song-title">—</div>
        <div class="song-artist" id="song-artist"></div>
        <div class="lyrics-scroll" id="lyrics-scroll">
          <div class="lyrics-message" id="lyrics-message">♪ Waiting for song...</div>
          <div class="lyrics-list" id="lyrics-list"></div>
        </div>
        <div class="hint" id="lyrics-source">Drag anywhere • Ctrl+Shift+L toggles click-through</div>
      </section>
    </main>
    <div class="drop-overlay" id="drop-overlay">Drop .lrc, .srt, or .txt lyrics</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="theme.js"></script>
    <script src="lyrics.js"></script>
  </body>
</html>

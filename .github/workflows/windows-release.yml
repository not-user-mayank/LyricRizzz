name: Windows beta release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable app
        run: npm run dist:win

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Lyricrizzz ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: release/*.exe
